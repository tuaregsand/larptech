[package]
name = "listener"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdkafka = { version = "0.36", features = ["tokio"] }
prost = "0.12"
futures-util = "0.3"
prost-types = "0.12"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
prometheus_exporter = "0.8"
async-stream = "0.3"
thiserror = "1"
url = "2.4.0"
idna = "0.4.0"

[patch.crates-io]
url = { path = "../../libs/patches/url-2.4.0/url-2.4.0" }
idna = { path = "../../libs/patches/idna-0.4.0/idna-0.4.0" }

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
testcontainers = "0.15"
bytes = "1"
warp = "0.3"
which = "4"
